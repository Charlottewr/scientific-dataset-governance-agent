[project]
name = "scientific-dataset-governance-agent"
version = "0.1.0"
description = "Evidence-first discovery, normalization, governance and review for public scientific datasets"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[project.scripts]
dataset-governance = "dataset_agent.cli:main"

[tool.setuptools.packages.find]
include = ["dataset_agent*"]

